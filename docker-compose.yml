name: knowledge-vault

services:
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      VITE_API_ORIGIN: http://localhost:${API_PORT:-8787}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8787
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT}
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ORIGIN: http://${MINIO_PUBLIC_ENDPOINT}:${MINIO_PUBLIC_PORT}
      IMPORT_DIR: /imports
      QDRANT_URL: http://qdrant:6333
      DOCLING_URL: http://docling:5001
      EMBEDDINGS_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      PUBLIC_CAPTURE_URL: http://public-capture:8080
    volumes:
      - ${IMPORT_DIR:-./local-imports}:/imports
    ports:
      - "${API_PORT:-8787}:8787"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      docling:
        condition: service_started
      embeddings:
        condition: service_started
      reranker:
        condition: service_started
      public-capture:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      REDIS_URL: ${REDIS_URL}
      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT}
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_USE_SSL: "false"
      IMPORT_DIR: /imports
      QDRANT_URL: http://qdrant:6333
      DOCLING_URL: http://docling:5001
      EMBEDDINGS_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
    volumes:
      - ${IMPORT_DIR:-./local-imports}:/imports
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      qdrant:
        condition: service_started
      docling:
        condition: service_started
      embeddings:
        condition: service_started
      reranker:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve-cpu:latest
    environment:
      DOCLING_DEVICE: cpu
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_MAX_FILE_SIZE: ${DOCLING_MAX_FILE_SIZE:-1073741824}
      DOCLING_SERVE_MAX_NUM_PAGES: ${DOCLING_MAX_NUM_PAGES:-2000}
      DOCLING_SERVE_ENG_KIND: local
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: ${DOCLING_WORKERS:-1}
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
    volumes:
      - docling_cache:/root/.cache
    restart: unless-stopped

  embeddings:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command:
      [
        "--model-id",
        "${EMBEDDING_MODEL:-BAAI/bge-m3}",
        "--max-concurrent-requests",
        "${TEI_MAX_CONCURRENT_REQUESTS:-2}",
        "--max-client-batch-size",
        "${TEI_MAX_CLIENT_BATCH_SIZE:-8}",
        "--auto-truncate",
      ]
    volumes:
      - embedding_models:/data
    restart: unless-stopped

  reranker:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command:
      [
        "--model-id",
        "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}",
        "--max-concurrent-requests",
        "${RERANKER_MAX_CONCURRENT_REQUESTS:-1}",
        "--max-client-batch-size",
        "${RERANKER_MAX_CLIENT_BATCH_SIZE:-12}",
        "--auto-truncate",
      ]
    volumes:
      - reranker_models:/data
    restart: unless-stopped

  public-capture:
    build:
      context: ./apps/public-capture
      dockerfile: Dockerfile
    environment:
      PUBLIC_CAPTURE_MAX_RESPONSE_BYTES: ${PUBLIC_CAPTURE_MAX_RESPONSE_BYTES:-8388608}
      PUBLIC_CAPTURE_MAX_TEXT_CHARS: ${PUBLIC_CAPTURE_MAX_TEXT_CHARS:-250000}
      PUBLIC_CAPTURE_MIN_INTERVAL_SECONDS: ${PUBLIC_CAPTURE_MIN_INTERVAL_SECONDS:-2}
    restart: unless-stopped

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password $$MONGO_INITDB_ROOT_PASSWORD --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PUBLIC_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set none local/$$MINIO_BUCKET"
    restart: "no"

volumes:
  mongo_data:
  minio_data:
  redis_data:
  qdrant_data:
  docling_cache:
  embedding_models:
  reranker_models:
